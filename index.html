<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the.madness.chamber — MC Rivera IDT Portfolio</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-canvas: #0D0D0E;        
            --bg-card: #141416;          
            --border-muted: #262629;     
            --text-primary: #F3F3F5;     
            --text-secondary: #8A8A93;   
            --accent-rustic: #A38A75;    
            
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-view {
            display: none;
            min-height: 100vh;
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .app-view.active-view {
            display: block;
            animation: fadeInView 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInView {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- EXQUISITE GATEWAY INTERFACE --- */
        #gateway-view {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        #gateway-view.active-view {
            display: flex;
        }

        .owner-branding {
            position: absolute;
            top: 3rem;
            left: 4rem;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .gateway-brand {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--accent-rustic);
            margin-bottom: 4rem;
        }

        .gateway-quote {
            font-family: var(--font-serif);
            font-size: 3.8rem;
            font-weight: 300;
            font-style: italic;
            line-height: 1.2;
            max-width: 850px;
            margin-bottom: 5rem;
            color: var(--text-primary);
        }

        .gateway-options {
            display: flex;
            gap: 4rem;
            width: 100%;
            max-width: 700px;
            justify-content: center;
        }

        .gateway-btn {
            background: none;
            border: none;
            cursor: pointer;
            text-align: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-muted);
            transition: all 0.3s ease;
            width: 280px;
        }

        .gateway-btn:hover {
            border-color: var(--text-primary);
            transform: translateY(-4px);
        }

        .gateway-btn h3 {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .gateway-btn span {
            font-family: var(--font-sans);
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* --- DASHBOARD CONFIGURATION --- */
        .dashboard-header {
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 2.5rem;
            margin-bottom: 4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
        }

        .dashboard-owner {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-rustic);
        }

        .back-nav {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            margin-bottom: 1.5rem;
            display: block;
            transition: color 0.2s ease;
        }

        .back-nav:hover {
            color: var(--text-primary);
        }

        .course-title h1 {
            font-family: var(--font-serif);
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1.1;
        }

        .course-title p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 0.5rem;
        }

        /* --- 3D FLIP CONTAINER PROPERTIES --- */
        .artifact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 3rem;
        }

        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 380px;
            perspective: 1200px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: left;
            transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 1px solid var(--border-muted);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        .flip-card-front {
            background-color: var(--bg-card);
            justify-content: space-between;
        }

        .front-visual-core {
            width: 100%;
            height: 180px;
            background-color: #16161A;
            position: relative;
            border: 1px dashed rgba(163, 138, 117, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .front-visual-core::before {
            content: '';
            position: absolute;
            width: 90%;
            height: 90%;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .card-meta-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
        }

        .card-core-heading {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 400;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .flip-card-back {
            background-color: #161619;
            transform: rotateY(180deg);
            justify-content: space-between;
            border-color: var(--accent-rustic);
        }

        .back-summary-text {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .explore-trigger-btn {
            background: none;
            border: none;
            color: var(--accent-rustic);
            font-family: var(--font-sans);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            text-align: left;
            padding-top: 1rem;
            border-top: 1px solid var(--border-muted);
            width: 100%;
            transition: color 0.2s ease;
        }

        .flip-card-back:hover .explore-trigger-btn {
            color: var(--text-primary);
        }

        .card-locked {
            opacity: 0.25;
            pointer-events: none;
        }

        /* --- OVERLAY SHEATH SYSTEM --- */
        .portal-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background-color: rgba(13, 13, 14, 0.98);
            overflow-y: auto;
            padding: 6rem 2rem;
        }

        .portal-modal.modal-open {
            display: block;
        }

        .modal-content-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .close-modal-btn {
            position: fixed;
            top: 3rem;
            right: 4rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-modal-btn:hover {
